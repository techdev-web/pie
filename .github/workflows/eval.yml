name: PIE eval gate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Golden + adversarial + phase8
        run: pytest tests/test_phase8.py -q
