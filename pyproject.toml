[project]
name = "pie"
version = "0.1.0"
description = "PIE — Property Intelligence Engine (Phase 0–1)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.17",
  "arq>=0.26.1",
  "redis>=5.2.0",
  "boto3>=1.35.0",
  "pypdf>=5.1.0",
  "pymupdf>=1.24.0",
  "httpx>=0.28.0",
  "google-genai>=1.0.0",
  "structlog>=24.4.0",
  "greenlet>=3.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.28.0",
  "ruff>=0.8.0",
]

[project.scripts]
pie-api = "apps.api.main:run"
pie-worker = "apps.worker.main:run"
pie-seed = "apps.api.seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "packages"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
